name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: Test et Build
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Lister les fichiers
        run: ls -la

      - name: Test simple
        run: echo "CI OK 🚀"

      # Exemple de build pour un projet Node.js (à adapter si nécessaire)
      - name: Installer Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Installer les dépendances
        run: npm install || echo "Pas de dépendances Node"

      - name: Build projet
        run: npm run build || echo "Pas de build nécessaire"

  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Log in Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ci-cd-webapp:latest .

      - name: Tag Docker image
        run: docker tag ci-cd-webapp:latest ${{ secrets.DOCKER_USERNAME }}/ci-cd-webapp:latest

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/ci-cd-webapp:latest

  deploy:
    name: Déploiement GitHub Pages
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Déployer sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist   # À adapter selon ton dossier contenant index.html

  notify:
    name: Notification Discord
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Envoyer notification Discord
        uses: Ilshidur/action-discord@v2
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          message: "✅ Déploiement terminé pour ${{ github.repository }} sur la branche ${{ github.ref_name }}"
